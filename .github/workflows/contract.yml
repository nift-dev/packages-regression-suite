name: Package regression contracts

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      nift-sha:
        description: 'Explicit Nift commit SHA to test against (default: main)'
        required: false
        type: string

permissions:
  contents: read

jobs:
  packages:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v5
        with:
          path: packages-regression-suite

      # Nift acquisition: a supplied SHA is checked out as a commit object via a
      # direct git fetch (never as refs/heads/<sha>); the default path uses main.
      - name: Checkout Nift source (branch or explicit commit SHA)
        shell: bash
        run: |
          set -euo pipefail
          git clone --filter=blob:none --no-checkout https://github.com/nift-dev/nift.git nift
          NIFT_REF='${{ inputs.nift-sha }}'
          if [[ -n "$NIFT_REF" ]]; then
            git -C nift fetch --no-tags origin "$NIFT_REF"
          else
            git -C nift fetch --no-tags origin main
          fi
          git -C nift checkout -q FETCH_HEAD
          printf 'Nift checkout: %s\n' "$(git -C nift rev-parse HEAD)"

      - name: Build Nift
        working-directory: nift
        run: make -j2

      # Clean official package sources with an exact per-run source manifest.
      - name: Resolve and clone clean official package sources
        shell: bash
        run: |
          set -euo pipefail
          bash packages-regression-suite/scripts/record_package_sources.sh package-sources.json

      - name: Run package regression suite
        run: |
          NIFT_BIN="$PWD/nift/nift" bash packages-regression-suite/run.sh

      - name: Upload package-source manifest
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: package-sources
          path: package-sources.json